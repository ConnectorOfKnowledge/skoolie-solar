      You need to enable JavaScript to run this app.

    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      (function () {
        function renderError(title, details) {
          var pre = document.createElement('pre');
          pre.style.whiteSpace = 'pre-wrap';
          pre.style.padding = '24px';
          pre.style.margin = '0';
          pre.style.fontFamily = 'Consolas, Menlo, monospace';
          pre.style.fontSize = '14px';
          pre.style.color = '#111827';
          pre.style.background = '#ffffff';
          pre.textContent = title + '\n\n' + details;
          document.body.innerHTML = '';
          document.body.appendChild(pre);
        }

        window.addEventListener('error', function (event) {
          var message = event.message || 'Unknown error';
          var source = event.filename || 'unknown source';
          var line = event.lineno || 0;
          var column = event.colno || 0;
          renderError('Window Error', message + '\n' + source + ':' + line + ':' + column);
        });

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var details = typeof reason === 'string' ? reason : JSON.stringify(reason, null, 2);
          renderError('Unhandled Promise Rejection', details || 'Unknown rejection');
        });
      })();
    </script>
